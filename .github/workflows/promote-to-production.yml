# After QA verifies staging, promote develop → main (1-click + environment approval).
# Then explicitly triggers Deploy to Production (GITHUB_TOKEN merges do not re-fire push workflows).
#
# Setup (once): Settings → Environments → production → Required reviewers
# Optional: secret GH_PAT (repo scope) if main branch protection blocks GITHUB_TOKEN

name: Promote to Production

on:
  workflow_dispatch:

concurrency:
  group: promote-to-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write
  checks: read

jobs:
  check-ci:
    name: Verify develop CI
    runs-on: ubuntu-latest
    outputs:
      develop_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Resolve develop tip
        id: sha
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "develop HEAD: ${SHA}"

      - name: Require develop ahead of main
        run: |
          set -euo pipefail
          git fetch origin main develop
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          echo "Commits on develop not in main: ${AHEAD}"
          if [ "${AHEAD}" -eq 0 ]; then
            echo "ERROR: develop has nothing new to promote to main"
            exit 1
          fi

      - name: Wait for CI success on develop tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEVELOP_SHA="${{ steps.sha.outputs.sha }}"
          echo "Waiting for CI - Build & Test on develop @ ${DEVELOP_SHA}"

          # Poll up to ~20 minutes for the run that matches develop tip
          for i in $(seq 1 60); do
            ROW=$(gh run list \
              --branch develop \
              --workflow "CI - Build & Test" \
              --limit 30 \
              --json databaseId,conclusion,headSha,status \
              --jq "[.[] | select(.headSha == \"${DEVELOP_SHA}\")] | .[0] // empty")

            if [ -n "${ROW}" ] && [ "${ROW}" != "null" ]; then
              STATUS=$(echo "${ROW}" | jq -r .status)
              CONCLUSION=$(echo "${ROW}" | jq -r .conclusion)
              RUN_ID=$(echo "${ROW}" | jq -r .databaseId)
              echo "Attempt ${i}: run=${RUN_ID} status=${STATUS} conclusion=${CONCLUSION}"

              if [ "${STATUS}" = "completed" ]; then
                if [ "${CONCLUSION}" = "success" ]; then
                  echo "CI gate OK"
                  exit 0
                fi
                echo "ERROR: CI on develop tip failed (${CONCLUSION})"
                echo "See: https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
                exit 1
              fi

              # In progress — wait on this run (falls through if watch returns early)
              gh run watch "${RUN_ID}" --exit-status && {
                echo "CI gate OK"
                exit 0
              } || {
                echo "ERROR: CI on develop tip did not succeed"
                echo "See: https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
                exit 1
              }
            fi

            echo "Attempt ${i}: no CI run for tip yet; sleeping 20s..."
            sleep 20
          done

          echo "ERROR: timed out waiting for CI on develop tip ${DEVELOP_SHA}"
          exit 1

  promote:
    name: Merge develop into main
    needs: check-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dompet-tenang.web.id
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create or reuse promote PR and merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          DEVELOP_SHA: ${{ needs.check-ci.outputs.develop_sha }}
        run: |
          set -euo pipefail
          git fetch origin main develop

          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            PR="${EXISTING}"
            echo "Reusing open PR #${PR}"
          else
            BODY=$(printf '%s\n' \
              "## Summary" \
              "Automated promote after QA approval on staging." \
              "" \
              "- Source: \`develop\` @ \`${DEVELOP_SHA}\`" \
              "- Staging: https://staging.dompet-tenang.web.id" \
              "- After merge: Deploy to Production is triggered explicitly" \
              "" \
              "## Test plan" \
              "- [x] QA verified staging" \
              "- [ ] Confirm Deploy to Production succeeds" \
              "- [ ] Smoke production health + login")

            URL=$(gh pr create \
              --base main \
              --head develop \
              --title "Promote develop → production (${DEVELOP_SHA:0:7})" \
              --body "${BODY}")
            PR=$(echo "${URL}" | grep -oE '[0-9]+$')
            echo "Created PR #${PR} (${URL})"
          fi

          gh pr merge "${PR}" --merge --delete-branch=false
          echo "Merged PR #${PR}"

      - name: Trigger Deploy to Production
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          # Push events from GITHUB_TOKEN do not start other workflows; dispatch explicitly.
          gh workflow run "Deploy to Production" --ref main
          echo "Dispatched Deploy to Production on main"
