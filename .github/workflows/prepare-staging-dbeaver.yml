# Prepare DBeaver access: verify localhost:15432 publish + upload connection env artifact.
name: Prepare staging DBeaver

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Verify port and upload creds artifact
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.dompet-tenang.web.id
    steps:
      - name: Prepare SSH key and known_hosts
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?Set secret PROD_SSH_HOST}"
          PORT="${PROD_SSH_PORT:-22}"
          KEY_RAW="${PROD_SSH_KEY:?Set secret PROD_SSH_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY_RAW" \
            | tr -d '\r' \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "ERROR: PROD_SSH_KEY must be the PRIVATE key"
            exit 1
          fi

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build staging-dbeaver.env on VPS and verify port
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          USER_NAME="${PROD_SSH_USER:?}"
          PORT="${PROD_SSH_PORT:-22}"

          mkdir -p /tmp/dbeaver-out

          ssh -i ~/.ssh/id_deploy -p "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${USER_NAME}@${HOST}" bash -s <<'EOF' > /tmp/dbeaver-out/staging-dbeaver.env
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/dompettenang}"
          ENV_FILE="${APP_DIR}/deploy/.env.staging"
          COMPOSE_FILE="${APP_DIR}/deploy/docker-compose.staging.yml"

          set -a
          # shellcheck source=/dev/null
          source <(grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB)=' "${ENV_FILE}")
          set +a

          echo "# Generated for DBeaver — do not commit"
          echo "# Run SSH tunnel first: local 15432 -> VPS 127.0.0.1:15432"
          echo "DB_HOST=localhost"
          echo "DB_PORT=15432"
          echo "POSTGRES_USER=${POSTGRES_USER:-dompet_stg}"
          echo "POSTGRES_DB=${POSTGRES_DB:-dompettenang_staging}"
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing}"

          # Verify publish (recreate postgres if compose was updated but container not recreated)
          PUBLISHED=$(docker compose -p dompettenang-staging -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
            port postgres 5432 2>/dev/null || true)
          if [[ -z "${PUBLISHED}" ]]; then
            echo "Recreating postgres to apply 127.0.0.1:15432 publish..." >&2
            docker compose -p dompettenang-staging -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
              up -d postgres
            sleep 3
            PUBLISHED=$(docker compose -p dompettenang-staging -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
              port postgres 5432 2>/dev/null || true)
          fi
          echo "PORT_PUBLISH=${PUBLISHED:-MISSING}" >&2
          if [[ -z "${PUBLISHED}" ]]; then
            echo "ERROR: postgres 5432 not published on host" >&2
            exit 1
          fi
          EOF

          {
            echo "SSH_HOST=${HOST}"
            echo "SSH_USER=${USER_NAME}"
            echo "SSH_PORT=${PORT}"
          } >> /tmp/dbeaver-out/staging-dbeaver.env

          echo "Wrote artifact fields (password redacted below):"
          grep -v '^POSTGRES_PASSWORD=' /tmp/dbeaver-out/staging-dbeaver.env || true
          echo "POSTGRES_PASSWORD=***"

      - name: Upload DBeaver env artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-dbeaver-env
          path: /tmp/dbeaver-out/staging-dbeaver.env
          retention-days: 1
