# Upsert SMTP_* into VPS deploy/.env.production via existing deploy SSH key.
# Pakai ini kalau login SSH password di laptop gagal (Permission denied).
#
# Setup (sekali):
#   GitHub → Settings → Secrets and variables → Actions (atau Environment production):
#     SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM
#     (opsional) SMTP_ENABLED  default true
#   Juga butuh secrets deploy yang sudah ada: PROD_SSH_*
#
# Lalu: Actions → Sync SMTP env → Run workflow

name: Sync SMTP env

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  sync:
    name: Upsert SMTP env on VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key and known_hosts
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?Set secret PROD_SSH_HOST}"
          PORT="${PROD_SSH_PORT:-22}"
          KEY_RAW="${PROD_SSH_KEY:?Set secret PROD_SSH_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY_RAW" \
            | tr -d '\r' \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "ERROR: PROD_SSH_KEY must be the PRIVATE key"
            exit 1
          fi

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upsert SMTP_* and recreate API
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SMTP_ENABLED: ${{ secrets.SMTP_ENABLED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          USER_NAME="${PROD_SSH_USER:?}"
          PORT="${PROD_SSH_PORT:-22}"

          : "${SMTP_HOST:?Set secret SMTP_HOST}"
          : "${SMTP_USER:?Set secret SMTP_USER}"
          : "${SMTP_PASS:?Set secret SMTP_PASS}"
          : "${SMTP_FROM:?Set secret SMTP_FROM}"

          ENABLED="${SMTP_ENABLED:-true}"
          SPORT="${SMTP_PORT:-465}"
          SECURE="${SMTP_SECURE:-true}"

          B64_ENABLED=$(printf '%s' "$ENABLED" | base64 -w0)
          B64_HOST=$(printf '%s' "$SMTP_HOST" | base64 -w0)
          B64_PORT=$(printf '%s' "$SPORT" | base64 -w0)
          B64_SECURE=$(printf '%s' "$SECURE" | base64 -w0)
          B64_USER=$(printf '%s' "$SMTP_USER" | base64 -w0)
          B64_PASS=$(printf '%s' "$SMTP_PASS" | base64 -w0)
          B64_FROM=$(printf '%s' "$SMTP_FROM" | base64 -w0)

          ssh -i ~/.ssh/id_deploy \
            -p "${PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${USER_NAME}@${HOST}" \
            B64_ENABLED="$B64_ENABLED" \
            B64_HOST="$B64_HOST" \
            B64_PORT="$B64_PORT" \
            B64_SECURE="$B64_SECURE" \
            B64_USER="$B64_USER" \
            B64_PASS="$B64_PASS" \
            B64_FROM="$B64_FROM" \
            'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/dompettenang}"
          ENV_FILE="${APP_DIR}/deploy/.env.production"
          COMPOSE_FILE="${APP_DIR}/deploy/docker-compose.prod.yml"

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "ERROR: missing ${ENV_FILE}"
            exit 1
          fi

          export SMTP_ENABLED=$(printf '%s' "$B64_ENABLED" | base64 -d)
          export SMTP_HOST=$(printf '%s' "$B64_HOST" | base64 -d)
          export SMTP_PORT=$(printf '%s' "$B64_PORT" | base64 -d)
          export SMTP_SECURE=$(printf '%s' "$B64_SECURE" | base64 -d)
          export SMTP_USER=$(printf '%s' "$B64_USER" | base64 -d)
          export SMTP_PASS=$(printf '%s' "$B64_PASS" | base64 -d)
          export SMTP_FROM=$(printf '%s' "$B64_FROM" | base64 -d)

          python3 - "$ENV_FILE" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          updates = {
              "SMTP_ENABLED": os.environ["SMTP_ENABLED"],
              "SMTP_HOST": os.environ["SMTP_HOST"],
              "SMTP_PORT": os.environ["SMTP_PORT"],
              "SMTP_SECURE": os.environ["SMTP_SECURE"],
              "SMTP_USER": os.environ["SMTP_USER"],
              "SMTP_PASS": os.environ["SMTP_PASS"],
              "SMTP_FROM": os.environ["SMTP_FROM"],
          }
          lines = text.splitlines()
          seen = set()
          out = []
          for line in lines:
              if "=" in line and not line.strip().startswith("#"):
                  key = line.split("=", 1)[0].strip()
                  if key in updates:
                      val = updates[key]
                      # Quote FROM if it contains spaces / angle brackets
                      if key == "SMTP_FROM" and (" " in val or "<" in val) and not (
                          (val.startswith('"') and val.endswith('"'))
                          or (val.startswith("'") and val.endswith("'"))
                      ):
                          val = '"' + val.replace('"', '\\"') + '"'
                      out.append(f"{key}={val}")
                      seen.add(key)
                      continue
              out.append(line)
          for key, val in updates.items():
              if key not in seen:
                  if key == "SMTP_FROM" and (" " in val or "<" in val) and not (
                      (val.startswith('"') and val.endswith('"'))
                      or (val.startswith("'") and val.endswith("'"))
                  ):
                      val = '"' + val.replace('"', '\\"') + '"'
                  out.append(f"{key}={val}")
          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("Updated:", ", ".join(updates.keys()))
          PY

          echo "==> SMTP keys present (values hidden):"
          grep -E '^SMTP_' "${ENV_FILE}" | sed -E 's/=.*/=***/'

          cd "${APP_DIR}"
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d --force-recreate api

          sleep 5
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" ps api
          EOF
