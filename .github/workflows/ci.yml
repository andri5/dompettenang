name: CI - Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      # package-lock.json is gitignored in this repo — do not use cache: npm / npm ci
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Lint code
        run: npm run lint --workspaces --if-present
        continue-on-error: true

      - name: Type-check API
        run: npm --workspace apps/api run build --if-present

      - name: Type-check & build Web
        run: npm --workspace apps/web run build --if-present

      - name: Run API unit tests
        run: npm --workspace apps/api run test -- --run

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./apps/api/coverage/coverage-final.json
          fail_ci_if_error: false

  prisma-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Validate Prisma schema
        run: npx --workspace apps/api prisma validate

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-and-test
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Install Playwright browsers
        run: npx --workspace apps/web playwright install --with-deps chromium

      - name: Run E2E tests (chromium only)
        run: npx --workspace apps/web playwright test --project=chromium
        continue-on-error: true
        env:
          CI: true
