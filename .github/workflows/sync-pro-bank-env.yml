# Upsert PRO_BANK_* into VPS deploy/.env.production via existing deploy SSH key.
# Use this when console/SSH password login fails.
#
# Setup (sekali):
#   GitHub → Settings → Secrets → Actions (atau Environment production):
#     PRO_BANK_NAME, PRO_BANK_ACCOUNT, PRO_BANK_HOLDER
#     (opsional) PRO_LIFETIME_PRICE  default 29000
#   Juga butuh secrets deploy yang sudah ada: PROD_SSH_*
#
# Lalu: Actions → Sync Pro bank env → Run workflow

name: Sync Pro bank env

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  sync:
    name: Upsert bank env on VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key and known_hosts
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?Set secret PROD_SSH_HOST}"
          PORT="${PROD_SSH_PORT:-22}"
          KEY_RAW="${PROD_SSH_KEY:?Set secret PROD_SSH_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY_RAW" \
            | tr -d '\r' \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "ERROR: PROD_SSH_KEY must be the PRIVATE key"
            exit 1
          fi

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upsert PRO_BANK_* and recreate API
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRO_LIFETIME_PRICE: ${{ secrets.PRO_LIFETIME_PRICE }}
          PRO_BANK_NAME: ${{ secrets.PRO_BANK_NAME }}
          PRO_BANK_ACCOUNT: ${{ secrets.PRO_BANK_ACCOUNT }}
          PRO_BANK_HOLDER: ${{ secrets.PRO_BANK_HOLDER }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          USER_NAME="${PROD_SSH_USER:?}"
          PORT="${PROD_SSH_PORT:-22}"

          : "${PRO_BANK_NAME:?Set secret PRO_BANK_NAME (GitHub Actions secrets)}"
          : "${PRO_BANK_ACCOUNT:?Set secret PRO_BANK_ACCOUNT}"
          : "${PRO_BANK_HOLDER:?Set secret PRO_BANK_HOLDER}"
          PRICE="${PRO_LIFETIME_PRICE:-29000}"

          B64_PRICE=$(printf '%s' "$PRICE" | base64 -w0)
          B64_NAME=$(printf '%s' "$PRO_BANK_NAME" | base64 -w0)
          B64_ACCOUNT=$(printf '%s' "$PRO_BANK_ACCOUNT" | base64 -w0)
          B64_HOLDER=$(printf '%s' "$PRO_BANK_HOLDER" | base64 -w0)

          ssh -i ~/.ssh/id_deploy \
            -p "${PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${USER_NAME}@${HOST}" \
            B64_PRICE="$B64_PRICE" \
            B64_NAME="$B64_NAME" \
            B64_ACCOUNT="$B64_ACCOUNT" \
            B64_HOLDER="$B64_HOLDER" \
            'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/dompettenang}"
          ENV_FILE="${APP_DIR}/deploy/.env.production"
          COMPOSE_FILE="${APP_DIR}/deploy/docker-compose.prod.yml"

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "ERROR: missing ${ENV_FILE}"
            exit 1
          fi

          export PRO_LIFETIME_PRICE=$(printf '%s' "$B64_PRICE" | base64 -d)
          export PRO_BANK_NAME=$(printf '%s' "$B64_NAME" | base64 -d)
          export PRO_BANK_ACCOUNT=$(printf '%s' "$B64_ACCOUNT" | base64 -d)
          export PRO_BANK_HOLDER=$(printf '%s' "$B64_HOLDER" | base64 -d)

          python3 - "$ENV_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          # values injected by outer bash via env
          import os
          updates = {
              "PRO_LIFETIME_PRICE": os.environ["PRO_LIFETIME_PRICE"],
              "PRO_BANK_NAME": os.environ["PRO_BANK_NAME"],
              "PRO_BANK_ACCOUNT": os.environ["PRO_BANK_ACCOUNT"],
              "PRO_BANK_HOLDER": os.environ["PRO_BANK_HOLDER"],
          }
          lines = text.splitlines()
          seen = set()
          out = []
          for line in lines:
              if "=" in line and not line.strip().startswith("#"):
                  key = line.split("=", 1)[0].strip()
                  if key in updates:
                      out.append(f"{key}={updates[key]}")
                      seen.add(key)
                      continue
              out.append(line)
          for key, val in updates.items():
              if key not in seen:
                  out.append(f"{key}={val}")
          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("Updated:", ", ".join(updates.keys()))
          PY

          echo "==> Keys present (values hidden):"
          grep -E '^PRO_(LIFETIME_PRICE|BANK_)' "${ENV_FILE}" | sed -E 's/=.*/=***/'

          cd "${APP_DIR}"
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d --force-recreate api

          sleep 5
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T api \
            node -e "fetch('http://127.0.0.1:3001/api/v1/billing/plans').then(async (r)=>{const j=await r.json(); if(!j?.data?.bank?.configured) { console.error(j); process.exit(2);} console.log('bank.configured=true');}).catch((e)=>{console.error(e); process.exit(1);})"
          EOF

      - name: Verify public plans endpoint
        run: |
          set -euo pipefail
          sleep 2
          curl -fsSL https://dompet-tenang.web.id/api/v1/billing/plans | tee /tmp/plans.json
          python3 -c "import json; d=json.load(open('/tmp/plans.json')); assert d['data']['bank']['configured'] is True, d; print('OK: bank configured')"
