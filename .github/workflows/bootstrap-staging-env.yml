# Create deploy/.env.staging on VPS (once) using production SSH + SMTP secrets.
# Also documents DNS: A record staging.dompet-tenang.web.id → VPS IP
#
# Actions → Bootstrap staging env → Run workflow

name: Bootstrap staging env

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create .env.staging on VPS
    runs-on: ubuntu-latest
    # Reuse production env secrets (PROD_SSH_*, SMTP_*, PRO_BANK_*)
    environment: production
    steps:
      - name: Prepare SSH key and known_hosts
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?Set secret PROD_SSH_HOST}"
          PORT="${PROD_SSH_PORT:-22}"
          KEY_RAW="${PROD_SSH_KEY:?Set secret PROD_SSH_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY_RAW" \
            | tr -d '\r' \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "ERROR: PROD_SSH_KEY must be the PRIVATE key"
            exit 1
          fi

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Write .env.staging if missing
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PRO_BANK_NAME: ${{ secrets.PRO_BANK_NAME }}
          PRO_BANK_ACCOUNT: ${{ secrets.PRO_BANK_ACCOUNT }}
          PRO_BANK_HOLDER: ${{ secrets.PRO_BANK_HOLDER }}
          PRO_LIFETIME_PRICE: ${{ secrets.PRO_LIFETIME_PRICE }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          USER_NAME="${PROD_SSH_USER:?}"
          PORT="${PROD_SSH_PORT:-22}"

          JWT1=$(openssl rand -base64 48)
          JWT2=$(openssl rand -base64 48)
          DBPASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)

          B64_JWT1=$(printf '%s' "$JWT1" | base64 -w0)
          B64_JWT2=$(printf '%s' "$JWT2" | base64 -w0)
          B64_DB=$(printf '%s' "$DBPASS" | base64 -w0)
          B64_SMTP_HOST=$(printf '%s' "${SMTP_HOST:-smtp.sumopod.com}" | base64 -w0)
          B64_SMTP_PORT=$(printf '%s' "${SMTP_PORT:-465}" | base64 -w0)
          B64_SMTP_SECURE=$(printf '%s' "${SMTP_SECURE:-true}" | base64 -w0)
          B64_SMTP_USER=$(printf '%s' "${SMTP_USER:-}" | base64 -w0)
          B64_SMTP_PASS=$(printf '%s' "${SMTP_PASS:-}" | base64 -w0)
          B64_SMTP_FROM=$(printf '%s' "${SMTP_FROM:-Dompet Tenang Staging <noreply@dompet-tenang.web.id>}" | base64 -w0)
          B64_BANK_NAME=$(printf '%s' "${PRO_BANK_NAME:-}" | base64 -w0)
          B64_BANK_ACCOUNT=$(printf '%s' "${PRO_BANK_ACCOUNT:-}" | base64 -w0)
          B64_BANK_HOLDER=$(printf '%s' "${PRO_BANK_HOLDER:-}" | base64 -w0)
          B64_PRICE=$(printf '%s' "${PRO_LIFETIME_PRICE:-29000}" | base64 -w0)

          ssh -i ~/.ssh/id_deploy \
            -p "${PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${USER_NAME}@${HOST}" \
            B64_JWT1="$B64_JWT1" \
            B64_JWT2="$B64_JWT2" \
            B64_DB="$B64_DB" \
            B64_SMTP_HOST="$B64_SMTP_HOST" \
            B64_SMTP_PORT="$B64_SMTP_PORT" \
            B64_SMTP_SECURE="$B64_SMTP_SECURE" \
            B64_SMTP_USER="$B64_SMTP_USER" \
            B64_SMTP_PASS="$B64_SMTP_PASS" \
            B64_SMTP_FROM="$B64_SMTP_FROM" \
            B64_BANK_NAME="$B64_BANK_NAME" \
            B64_BANK_ACCOUNT="$B64_BANK_ACCOUNT" \
            B64_BANK_HOLDER="$B64_BANK_HOLDER" \
            B64_PRICE="$B64_PRICE" \
            'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/dompettenang}"
          ENV_FILE="${APP_DIR}/deploy/.env.staging"
          mkdir -p "${APP_DIR}/deploy"

          if [[ -f "${ENV_FILE}" ]]; then
            echo "==> ${ENV_FILE} already exists — leaving unchanged"
            grep -E '^(DOMAIN|CORS_ORIGIN|APP_URL|POSTGRES_DB|SMTP_HOST)=' "${ENV_FILE}" || true
            exit 0
          fi

          JWT1=$(printf '%s' "$B64_JWT1" | base64 -d)
          JWT2=$(printf '%s' "$B64_JWT2" | base64 -d)
          DBPASS=$(printf '%s' "$B64_DB" | base64 -d)
          SMTP_HOST=$(printf '%s' "$B64_SMTP_HOST" | base64 -d)
          SMTP_PORT=$(printf '%s' "$B64_SMTP_PORT" | base64 -d)
          SMTP_SECURE=$(printf '%s' "$B64_SMTP_SECURE" | base64 -d)
          SMTP_USER=$(printf '%s' "$B64_SMTP_USER" | base64 -d)
          SMTP_PASS=$(printf '%s' "$B64_SMTP_PASS" | base64 -d)
          SMTP_FROM=$(printf '%s' "$B64_SMTP_FROM" | base64 -d)
          PRO_BANK_NAME=$(printf '%s' "$B64_BANK_NAME" | base64 -d)
          PRO_BANK_ACCOUNT=$(printf '%s' "$B64_BANK_ACCOUNT" | base64 -d)
          PRO_BANK_HOLDER=$(printf '%s' "$B64_BANK_HOLDER" | base64 -d)
          PRO_LIFETIME_PRICE=$(printf '%s' "$B64_PRICE" | base64 -d)

          # Quote FROM if needed
          FROM_LINE="$SMTP_FROM"
          if [[ "$FROM_LINE" == *" "* || "$FROM_LINE" == *"*"* || "$FROM_LINE" == *"<"* ]]; then
            if [[ "$FROM_LINE" != \"*\" ]]; then
              FROM_LINE="\"${FROM_LINE//\"/\\\"}\""
            fi
          fi

          cat > "${ENV_FILE}" <<ENV
          DOMAIN=dompet-tenang.web.id
          CORS_ORIGIN=https://staging.dompet-tenang.web.id
          APP_URL=https://staging.dompet-tenang.web.id
          POSTGRES_USER=dompet_stg
          POSTGRES_PASSWORD=${DBPASS}
          POSTGRES_DB=dompettenang_staging
          JWT_SECRET=${JWT1}
          JWT_REFRESH_SECRET=${JWT2}
          SMTP_ENABLED=true
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_SECURE=${SMTP_SECURE}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          SMTP_FROM=${FROM_LINE}
          PRO_LIFETIME_PRICE=${PRO_LIFETIME_PRICE}
          PRO_BANK_NAME=${PRO_BANK_NAME}
          PRO_BANK_ACCOUNT=${PRO_BANK_ACCOUNT}
          PRO_BANK_HOLDER=${PRO_BANK_HOLDER}
          COOKIE_SAME_SITE=lax
          ENV

          # Remove leading spaces from heredoc indent
          sed -i 's/^          //' "${ENV_FILE}"
          chmod 600 "${ENV_FILE}"
          echo "==> Created ${ENV_FILE}"
          echo "==> Next: DNS A record staging.dompet-tenang.web.id → this VPS IP"
          echo "==> Then run Actions → Deploy to Staging"
          EOF
