# One-off ops: lookup a user on staging by name/email fragment.
name: Check staging user

on:
  workflow_dispatch:
    inputs:
      query:
        description: Fragment name atau email (ILIKE)
        required: true
        type: string
        default: donkditren

jobs:
  lookup:
    name: Lookup user on staging DB
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.dompet-tenang.web.id
    steps:
      - name: Prepare SSH key and known_hosts
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?Set secret PROD_SSH_HOST}"
          PORT="${PROD_SSH_PORT:-22}"
          KEY_RAW="${PROD_SSH_KEY:?Set secret PROD_SSH_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY_RAW" \
            | tr -d '\r' \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "ERROR: PROD_SSH_KEY must be the PRIVATE key"
            exit 1
          fi

          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Query users table
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          USER_NAME="${PROD_SSH_USER:?}"
          PORT="${PROD_SSH_PORT:-22}"
          Q="${QUERY:?}"

          ssh -i ~/.ssh/id_deploy -p "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${USER_NAME}@${HOST}" \
            QUERY="$Q" bash -s <<'EOF'
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/dompettenang}"
          COMPOSE_FILE="${APP_DIR}/deploy/docker-compose.staging.yml"
          ENV_FILE="${APP_DIR}/deploy/.env.staging"

          set -a
          # shellcheck source=/dev/null
          source <(grep -E '^(POSTGRES_USER|POSTGRES_DB)=' "${ENV_FILE}")
          set +a
          PGUSER="${POSTGRES_USER:-dompet_stg}"
          PGDB="${POSTGRES_DB:-dompettenang_staging}"

          # Escape % and _ for LIKE; wrap as %query%
          LIKE="%${QUERY//%/\\%}%"
          LIKE="${LIKE//_/\\_}"

          echo "LOOKUP_QUERY=${QUERY}"
          docker compose -p dompettenang-staging -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
            exec -T postgres \
            psql -U "${PGUSER}" -d "${PGDB}" -v ON_ERROR_STOP=1 -c \
            "SELECT id, name, email, role::text, plan::text, created_at
             FROM users
             WHERE name ILIKE '${LIKE}' ESCAPE '\'
                OR email ILIKE '${LIKE}' ESCAPE '\'
             ORDER BY created_at DESC
             LIMIT 20;"
          EOF
