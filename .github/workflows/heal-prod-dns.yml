# Emergency: reclaim production hostname "api"/"web" from staging orphans.
# Actions → Heal prod API DNS → Run workflow

name: Heal prod API DNS

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  heal:
    name: Fix staging/prod Docker DNS collision
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          PORT="${PROD_SSH_PORT:-22}"
          KEY_RAW="${PROD_SSH_KEY:?}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY_RAW" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      - name: Heal DNS on VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          HOST="${PROD_SSH_HOST:?}"
          USER_NAME="${PROD_SSH_USER:?}"
          PORT="${PROD_SSH_PORT:-22}"
          SSH=(ssh -i ~/.ssh/id_deploy -p "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          "${SSH[@]}" "${USER_NAME}@${HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/dompettenang}"
          cd "${APP_DIR}"

          echo "==> Before"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -40 || true
          echo "==> DNS api on dompettenang_internal"
          docker run --rm --network dompettenang_internal alpine:3.20 nslookup api 2>/dev/null || true

          echo "==> Tear down staging project (remove orphans)"
          if [[ -f deploy/docker-compose.staging.yml && -f deploy/.env.staging ]]; then
            docker compose -p dompettenang-staging -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging down --remove-orphans || true
          fi

          # Explicitly remove any leftover staging containers that still claim api/web
          for c in $(docker ps -aq --filter name=dompettenang-staging); do
            echo "Removing $c"
            docker rm -f "$c" || true
          done

          echo "==> Recreate staging with api-staging/web-staging names"
          if [[ -f deploy/docker-compose.staging.yml && -f deploy/.env.staging ]]; then
            docker compose -p dompettenang-staging -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging up -d --force-recreate
          fi

          echo "==> Force-recreate production api/web/caddy to reclaim DNS"
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --force-recreate api web caddy

          echo "==> After"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -40 || true
          echo "==> DNS api"
          docker run --rm --network dompettenang_internal alpine:3.20 nslookup api 2>/dev/null || true
          echo "==> CORS check from host"
          curl -sS -D - -o /dev/null -X POST http://127.0.0.1/api/v1/health -H "Host: dompet-tenang.web.id" 2>/dev/null | head -5 || true
          curl -sS https://dompet-tenang.web.id/api/v1/health || true
          echo
          EOF
