# Dompet Tenang — staging stack (same VPS as production)
# Shares production Caddy network so https://staging.DOMAIN works.
#
# IMPORTANT: service names on prod_edge MUST NOT be `api` / `web`.
# Compose registers the service name as a DNS alias on every attached
# network; naming them `api` stole production's hostname and broke prod login.
#
# Usage:
#   cp deploy/.env.staging.example deploy/.env.staging
#   # edit secrets
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging up -d --build
#   # reload prod Caddy (picks up Caddyfile staging block):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d caddy

name: dompettenang-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dompet_stg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dompettenang_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-dompet_stg} -d ${POSTGRES_DB:-dompettenang_staging}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - staging_internal

  api-staging:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-dompet_stg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dompettenang_staging}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://staging.${DOMAIN}}
      APP_URL: ${APP_URL:-https://staging.${DOMAIN}}
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EXPOSE_PASSWORD_RESET_URL: 'false'
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PRO_LIFETIME_PRICE: ${PRO_LIFETIME_PRICE:-29000}
      PRO_BANK_NAME: ${PRO_BANK_NAME:-}
      PRO_BANK_ACCOUNT: ${PRO_BANK_ACCOUNT:-}
      PRO_BANK_HOLDER: ${PRO_BANK_HOLDER:-}
    volumes:
      - uploads_staging_data:/app/uploads
    networks:
      - staging_internal
      - prod_edge

  web-staging:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SITE_URL: https://staging.${DOMAIN}
    restart: unless-stopped
    networks:
      - staging_internal
      - prod_edge

volumes:
  postgres_staging_data:
  uploads_staging_data:

networks:
  staging_internal:
    driver: bridge
  # Join production Caddy network (created by docker-compose.prod.yml project "dompettenang")
  prod_edge:
    external: true
    name: dompettenang_internal
