<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidak ditemukan — Dompet Tenang</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0a1628;
        color: #f8fafc;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 1.5rem;
        color: rgba(248, 250, 252, 0.6);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: #0f9b8e;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        padding: 0.85rem 1.25rem;
      }
      .code {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(248, 250, 252, 0.45);
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Halaman tidak ditemukan</h1>
      <p>
        File atau tautan yang kamu buka tidak ada. Kembali ke beranda Dompet Tenang.
      </p>
      <a href="/">Ke Beranda</a>
    </main>
  </body>
</html>
